[pytest]
markers =
    persistence: Tests for data persistence
    security: testes de segurança (XSS, injeção básica)
    e2e: testes end-to-end
    validations: testes de validação de campos
    navigation: testes de navegação
    cpf: testes específicos de validação de CPF
    data: testes específicos de validação de data de nascimento
    smoke: testes críticos que devem rodar em todo deploy
    blocked: testes bloqueados por bugs conhecidos
    rg: testes de validação de RG
    cargo: testes de validação de cargo
    epi: testes de validação de EPI
    nome: testes de validação de nome
    form: testes gerais de formulário
    xss: testes de segurança XSS
    sql-injection: testes de SQL injection
    bug_001: BUG-001 - Menu de opções não abre
    bug_002: BUG-002 - Botão adicionar atividade volta para tela inicial
    bug_003: BUG-003 - Lista sem scroll oculta funcionários
    bug_005: BUG-005 - Botão adicionar EPI não funciona
testpaths = tests
bdd_features_base_dir = features/